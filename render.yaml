# Render blueprint for SIGNAL backend.
# Hooked up via the "Deploy to Render" button in the repo README.
# Render auto-injects RENDER_EXTERNAL_URL; the app picks it up so PDF
# download links work out of the box.

services:
  - type: web
    name: signal-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false              # user fills this in the Render dashboard
      - key: TAVILY_API_KEY
        sync: false              # optional
      - key: ALLOW_MOCK_FALLBACK
        value: "1"
      - key: REPORT_TTL_HOURS
        value: "24"
