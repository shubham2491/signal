<!doctype html>
<html><head>
<meta charset="utf-8">
<style>
:root {
  --bg: #FBF8F2;
  --surface: #FFFFFF;
  --surface-muted: #F4EFE5;
  --text: #1F1F1D;
  --text-muted: #6B6760;
  --text-subtle: #9A938A;
  --divider: #E6E2D8;
  --emerald: #1F5F4A;
  --emerald-soft: #E3EDE7;
  --burgundy: #7A2A2A;
  --burgundy-soft: #F3E3E3;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { margin: 0; padding: 0; }
body {
  width: 390px; height: 844px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif;
  overflow: hidden;
  position: relative;
}
.kicker {
  font-size: 11px; font-weight: 600; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--text-muted);
}
.kicker--emerald { color: var(--emerald); }
.kicker--burgundy { color: var(--burgundy); }
.card {
  background: var(--surface);
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 6px 16px rgba(31,31,29,0.06);
}
.card--flat {
  background: var(--surface-muted);
  border-radius: 14px;
  padding: 18px;
  box-shadow: none;
}
.btn {
  height: 54px;
  border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 600; letter-spacing: 0.1px;
}
.btn--primary { background: var(--text); color: #fff; }
.btn--secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--divider);
}
.statusbar {
  height: 44px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  font-size: 13px; font-weight: 600;
}
.statusbar .right { display: flex; gap: 6px; align-items: center; }
.dot { width: 4px; height: 4px; background: #1F1F1D; border-radius: 50%; }
</style>
</head><body>
<div class="statusbar"><span>9:41</span></div>
<div style="padding: 200px 32px 0 32px;">
  <div class="kicker">Analyzing</div>
  <div style="font-size: 26px; font-weight: 700; color: var(--text);
              margin-top:4px; margin-bottom: 32px;">Reading the floor</div>
  
<div style="display:flex; align-items:center; padding: 12px 0;">
  <div style="width:24px; display:flex; justify-content:center; align-items:center;
              position:relative; margin-right:12px;">
    
    <div style="width:8px; height:8px; border-radius:50%; background:var(--text);"></div>
  </div>
  <div style="font-size:15px; color:var(--text-muted); font-weight:400;">Reading images</div>
</div>

<div style="display:flex; align-items:center; padding: 12px 0;">
  <div style="width:24px; display:flex; justify-content:center; align-items:center;
              position:relative; margin-right:12px;">
    
    <div style="width:8px; height:8px; border-radius:50%; background:var(--text);"></div>
  </div>
  <div style="font-size:15px; color:var(--text-muted); font-weight:400;">Detecting context</div>
</div>

<div style="display:flex; align-items:center; padding: 12px 0;">
  <div style="width:24px; display:flex; justify-content:center; align-items:center;
              position:relative; margin-right:12px;">
    <div style="position:absolute; width:20px; height:20px; border-radius:50%;background: var(--emerald); opacity:0.18"></div>
    <div style="width:8px; height:8px; border-radius:50%; background:var(--emerald);"></div>
  </div>
  <div style="font-size:15px; color:var(--text); font-weight:600;">Selecting brand cohort</div>
</div>

<div style="display:flex; align-items:center; padding: 12px 0;">
  <div style="width:24px; display:flex; justify-content:center; align-items:center;
              position:relative; margin-right:12px;">
    
    <div style="width:8px; height:8px; border-radius:50%; background:var(--divider);"></div>
  </div>
  <div style="font-size:15px; color:var(--text-subtle); font-weight:400;">Pulling live retailer signals</div>
</div>

<div style="display:flex; align-items:center; padding: 12px 0;">
  <div style="width:24px; display:flex; justify-content:center; align-items:center;
              position:relative; margin-right:12px;">
    
    <div style="width:8px; height:8px; border-radius:50%; background:var(--divider);"></div>
  </div>
  <div style="font-size:15px; color:var(--text-subtle); font-weight:400;">Writing the brief</div>
</div>

</div>
</body></html>
